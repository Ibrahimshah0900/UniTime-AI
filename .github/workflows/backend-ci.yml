name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      AUTH_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: sqlite:///data/ci_unitime_ai.db
      APP_TIMEZONE: Asia/Karachi

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest tests -q
      - run: git diff --check
