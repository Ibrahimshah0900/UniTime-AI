name: UniTime-AI CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      AUTH_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: sqlite:///data/ci_unitime_ai.db
      APP_TIMEZONE: Asia/Karachi

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest tests -q
      - run: git diff --check
      - run: docker build -t unitime-ai-api:ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t unitime-ai-frontend:ci frontend

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unitime_ci
          POSTGRES_USER: unitime_ci
          POSTGRES_PASSWORD: unitime_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unitime_ci -d unitime_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      AUTH_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://unitime_ci:unitime_ci_password@127.0.0.1:5432/unitime_ci
      APP_TIMEZONE: Asia/Karachi
      RUN_LIVE_DATABASE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest tests/test_live_database_smoke.py tests/test_live_postgres_concurrency.py -q
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
        working-directory: frontend
      - name: Build frontend for Android
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
          CAPACITOR_DEV_CLEARTEXT: "1"
      - name: Sync Capacitor Android
        run: npx cap sync android
        working-directory: frontend
        env:
          CAPACITOR_DEV_CLEARTEXT: "1"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: frontend/android
      - name: Build Android debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UniTime-AI-Android-Debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

